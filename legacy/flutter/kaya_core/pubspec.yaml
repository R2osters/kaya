name: kaya_core
description: Shared Flutter package for the Kaya delivery platform (theme, models, API client, realtime, services, i18n).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / theme
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Networking
  dio: ^5.4.3+1

  # Realtime
  socket_io_client: ^2.0.3+1

  # Secure storage / device
  flutter_secure_storage: ^9.2.2
  geolocator: 12.0.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3

  # Firebase (guarded — app runs without Firebase config)
  firebase_messaging: ^15.0.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1

  # Loading states / shimmer
  shimmer: ^3.0.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  # ARB files under lib/l10n are the formal string source; the compiled
  # delegate lives at lib/src/l10n/kaya_l10n.dart (no codegen step required).
  uses-material-design: true
