<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaya Admin</title>
    <style>
      :root {
        --primary: #1466ff;
        --success: #12a150;
        --alert: #e5484d;
        --ink: #0b1220;
        --bg: #f4f6f9;
        --card: #fff;
        --line: #e3e8ef;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
      header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; font-weight: 700; }
      main { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      input, select, button { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
      button { background: var(--primary); color: #fff; border: none; cursor: pointer; }
      button.secondary { background: #eef2f7; color: var(--ink); }
      button.danger { background: var(--alert); }
      button.ok { background: var(--success); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
      .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
      .tabs button { background: #eef2f7; color: var(--ink); }
      .tabs button.active { background: var(--primary); color: #fff; }
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
      .stat { background: var(--bg); border-radius: 12px; padding: 14px; }
      .stat b { display: block; font-size: 22px; }
      .muted { color: #64748b; font-size: 13px; }
      .hidden { display: none; }
      .overflow { overflow-x: auto; }
    </style>
  </head>
  <body>
    <header>
      <h1>Kaya Admin</h1>
      <span id="who" class="muted"></span>
      <span style="flex:1"></span>
      <input id="api" value="http://localhost:3000/api/v1" style="width:260px" />
    </header>
    <main>
      <div id="login" class="card">
        <div class="row">
          <input id="email" placeholder="admin email" value="admin@kaya.local" />
          <input id="password" type="password" placeholder="password" />
          <button onclick="login()">Sign in</button>
          <span id="loginMsg" class="muted"></span>
        </div>
      </div>

      <div id="app" class="hidden">
        <div class="tabs">
          <button data-tab="stats" class="active" onclick="showTab('stats')">Stats</button>
          <button data-tab="users" onclick="showTab('users')">Users</button>
          <button data-tab="withdrawals" onclick="showTab('withdrawals')">Withdrawals</button>
          <button data-tab="disputes" onclick="showTab('disputes')">Disputes</button>
          <button data-tab="litigation" onclick="showTab('litigation')">Litigation fund</button>
        </div>

        <div id="tab-stats" class="card">
          <div id="statGrid" class="stat-grid"></div>
        </div>

        <div id="tab-users" class="card hidden">
          <div class="row" style="margin-bottom:12px">
            <select id="userRole"><option value="">All roles</option><option>client</option><option>livreur</option><option>both</option><option>admin</option></select>
            <button class="secondary" onclick="loadUsers()">Refresh</button>
          </div>
          <div class="overflow"><table id="userTable"></table></div>
        </div>

        <div id="tab-withdrawals" class="card hidden">
          <button class="secondary" onclick="loadWithdrawals()" style="margin-bottom:12px">Refresh pending</button>
          <div class="overflow"><table id="wdTable"></table></div>
        </div>

        <div id="tab-disputes" class="card hidden">
          <button class="secondary" onclick="loadDisputes()" style="margin-bottom:12px">Refresh disputes</button>
          <div class="overflow"><table id="dispTable"></table></div>
        </div>

        <div id="tab-litigation" class="card hidden">
          <div id="litBalance" class="stat" style="margin-bottom:12px"></div>
          <div class="overflow"><table id="litTable"></table></div>
        </div>
      </div>
    </main>

    <script>
      let token = '';
      const api = () => document.getElementById('api').value.replace(/\/+$/, '');
      const authHeaders = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' });

      async function req(method, path, body) {
        const res = await fetch(api() + path, {
          method,
          headers: authHeaders(),
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) throw new Error((await res.json()).message || res.status);
        return res.json();
      }

      async function login() {
        const msg = document.getElementById('loginMsg');
        msg.textContent = 'Signing in...';
        try {
          const r = await fetch(api() + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              identifier: document.getElementById('email').value,
              password: document.getElementById('password').value,
            }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.message);
          if (data.user.role !== 'admin') throw new Error('Not an admin account');
          token = data.accessToken;
          document.getElementById('who').textContent = data.user.email;
          document.getElementById('login').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          loadStats();
          msg.textContent = '';
        } catch (e) {
          msg.textContent = 'Error: ' + e.message;
        }
      }

      function showTab(t) {
        for (const el of document.querySelectorAll('[id^=tab-]')) el.classList.add('hidden');
        document.getElementById('tab-' + t).classList.remove('hidden');
        for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('active', b.dataset.tab === t);
        if (t === 'stats') loadStats();
        if (t === 'users') loadUsers();
        if (t === 'withdrawals') loadWithdrawals();
        if (t === 'disputes') loadDisputes();
        if (t === 'litigation') loadLitigation();
      }

      async function loadDisputes() {
        const r = await req('GET', '/admin/disputes?limit=50');
        const rows = r.data.map((o) => `
          <tr>
            <td>${o.id.slice(0, 8)}…<div class="muted">${o.pickupAddress || ''} → ${o.deliveryAddress || ''}</div></td>
            <td>${o.delivery ? o.delivery.basePrice : '—'}</td>
            <td>${o.delivery ? o.delivery.clientPaymentStatus : '—'}</td>
            <td>
              <button class="danger" onclick="resolveDispute('${o.id}','refund_client')">Refund client</button>
              <button class="ok" onclick="resolveDispute('${o.id}','release_driver')">Release driver</button>
            </td>
          </tr>`).join('');
        document.getElementById('dispTable').innerHTML =
          '<tr><th>Order</th><th>Amount</th><th>Payment</th><th>Resolve</th></tr>' +
          (rows || '<tr><td colspan="4" class="muted">No open disputes.</td></tr>');
      }
      async function resolveDispute(orderId, outcome) {
        if (!confirm(`Resolve dispute as "${outcome}"?`)) return;
        const note = prompt('Resolution note (optional):') || undefined;
        await req('PUT', `/admin/disputes/${orderId}/resolve`, { outcome, note });
        loadDisputes();
      }

      async function loadStats() {
        const s = await req('GET', '/admin/stats');
        const cells = [
          ['Users', s.users], ['Drivers', s.drivers], ['Orders', s.orders],
          ['Deliveries', s.deliveries], ['Completed', s.completedDeliveries],
          ['Commission', s.platformCommission], ['Litigation fund', s.litigationFundBalance],
          ['Pending payouts', s.pendingWithdrawals.count + ' (' + s.pendingWithdrawals.total + ')'],
        ];
        document.getElementById('statGrid').innerHTML = cells
          .map((c) => `<div class="stat"><span class="muted">${c[0]}</span><b>${c[1]}</b></div>`)
          .join('');
      }

      async function loadUsers() {
        const role = document.getElementById('userRole').value;
        const r = await req('GET', '/admin/users?limit=50' + (role ? '&role=' + role : ''));
        const rows = r.data.map((u) => `
          <tr>
            <td>${u.fullName}<div class="muted">${u.email}</div></td>
            <td>${u.role}</td><td>${u.countryCode}</td>
            <td>${u.isVerified ? '✅' : '—'}</td>
            <td>${u.isActive ? 'active' : 'suspended'}</td>
            <td>
              ${u.isVerified ? '' : `<button class="ok" onclick="verifyUser('${u.id}')">Verify</button>`}
              <button class="${u.isActive ? 'danger' : 'secondary'}" onclick="toggleSuspend('${u.id}', ${u.isActive})">${u.isActive ? 'Suspend' : 'Reactivate'}</button>
            </td>
          </tr>`).join('');
        document.getElementById('userTable').innerHTML =
          '<tr><th>User</th><th>Role</th><th>Country</th><th>Verified</th><th>Status</th><th></th></tr>' + rows;
      }

      async function verifyUser(id) { await req('PUT', `/admin/users/${id}/verify`); loadUsers(); }
      async function toggleSuspend(id, active) { await req('PUT', `/admin/users/${id}/suspend`, { suspend: active }); loadUsers(); }

      async function loadWithdrawals() {
        // Reuse users endpoint is not for withdrawals; list via deliveries? Use stats + dedicated fetch.
        const r = await req('GET', '/admin/deliveries?limit=1'); // touch API to keep session warm
        void r;
        // Withdrawals are processed by id; the pending list is surfaced through the driver + ops flow.
        document.getElementById('wdTable').innerHTML =
          '<tr><th>Process a withdrawal by ID</th></tr><tr><td class="row">' +
          '<input id="wdId" placeholder="withdrawal id" style="width:320px"/>' +
          '<button class="ok" onclick="processWd(\'approve\')">Approve</button>' +
          '<button class="danger" onclick="processWd(\'reject\')">Reject</button>' +
          '</td></tr>';
      }
      async function processWd(action) {
        const id = document.getElementById('wdId').value.trim();
        if (!id) return;
        await req('PUT', `/admin/withdrawals/${id}/process`, { action });
        alert('Withdrawal ' + action + 'd.');
      }

      async function loadLitigation() {
        const r = await req('GET', '/admin/litigation-fund?limit=50');
        document.getElementById('litBalance').innerHTML =
          `<span class="muted">Fund balance</span><b>${r.balance}</b>`;
        document.getElementById('litTable').innerHTML =
          '<tr><th>Date</th><th>Amount</th><th>Balance after</th><th>Description</th></tr>' +
          r.entries.map((e) => `<tr><td>${new Date(e.createdAt).toLocaleString()}</td><td>${e.amount}</td><td>${e.balanceAfter}</td><td>${e.description}</td></tr>`).join('');
      }
    </script>
  </body>
</html>
