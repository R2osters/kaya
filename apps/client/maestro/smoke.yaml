appId: com.kaya.kaya_client
name: Kaya client shell smoke (anonymous)
---
# The anonymous half of the phase 1C acceptance flow. Run against a development
# build (Expo Go cannot load @react-native-firebase/messaging):
#
#   npm run android -w client
#   maestro test apps/client/maestro/smoke.yaml
#
# This file used to walk the whole route tree. It could not: verified on a
# device, the route guard bounces an anonymous session off every route except
# welcome/login/register, so `tapOn link-/home` returned straight to welcome
# and the flow contradicted itself. Walking the tree needs a session, and there
# is no login form until phase 2 -- so it lives in smoke-dev.yaml, which runs
# against a SKIP_AUTH build. What is left here is what an anonymous session can
# actually prove, and it is worth proving: the guard is the one piece of this
# phase that decides what a signed-out user is allowed to see.

- launchApp:
    clearState: true

# Guard rule 1 holds every navigation on splash while `status` is `unknown`;
# rule 2 then sends an anonymous session to welcome. Seeing welcome is proof
# that restoreSession() settled -- the failure this guards against is the app
# sitting on splash forever, which an unhandled rejection in restoration
# produces.
- assertVisible:
    id: "welcome-screen"

# The screen names itself through @kaya/core's i18n resources rather than a
# hardcoded string, so a broken i18n wire-up surfaces as a missing key rather
# than as text that happens to look right.
- assertVisible:
    id: "welcome-screen-title"

# Rule 2 in the other direction, which is the security-relevant half: tapping
# through to a protected route must come back to welcome, not open it. This is
# a real device behaviour that no unit test covers -- authGuard.test.ts checks
# the pure function, not that the layout actually applies its verdict to a
# live navigation.
- tapOn:
    id: "link-/home"
- assertVisible:
    id: "welcome-screen"

- tapOn:
    id: "link-/create-order"
- assertVisible:
    id: "welcome-screen"

# An auth route is allowed through, so the bounce above is the guard working
# rather than navigation being broken outright.
- tapOn:
    id: "link-/login"
- assertVisible:
    id: "login-screen"
