appId: com.kaya.kaya_client
name: Kaya client shell smoke (anonymous)
---
# The anonymous half of the phase 1C acceptance flow. Run against a development
# build (Expo Go cannot load @react-native-firebase/messaging):
#
#   npm run android -w client
#   maestro test apps/client/maestro/smoke.yaml
#
# This file used to walk the whole route tree. It could not: verified on a
# device, the route guard bounces an anonymous session off every route except
# welcome/login/register, so `tapOn link-/home` returned straight to welcome
# and the flow contradicted itself. Walking the tree needs a session, and there
# is no login form until phase 2 -- so it lives in smoke-dev.yaml, which runs
# against a SKIP_AUTH build. What is left here is what an anonymous session can
# actually prove, and it is worth proving: the guard is the one piece of this
# phase that decides what a signed-out user is allowed to see.

- launchApp:
    clearState: true

# Guard rule 1 holds every navigation on splash while `status` is `unknown`;
# rule 2 then sends an anonymous session to welcome. Seeing welcome is proof
# that restoreSession() settled -- the failure this guards against is the app
# sitting on splash forever, which an unhandled rejection in restoration
# produces.
# extendedWaitUntil, not assertVisible: a development build fetches its JS
# bundle from Metro on launch, which takes about ten seconds, and a bare
# assertion checks before the first frame exists. The flow failed here on its
# first ever run for exactly that reason -- the app was fine.
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 40000

# The screen names itself through @kaya/core's i18n resources rather than a
# hardcoded string, so a broken i18n wire-up surfaces as a missing key rather
# than as text that happens to look right.
- assertVisible:
    id: "welcome-screen-title"

# Welcome is a real screen since slice C, so it no longer renders the route
# explorer every placeholder carried -- this flow used to tap `link-/home` and
# stopped working the day welcome stopped being a placeholder. It offers two
# doors, and both are worth walking.
#
# The guard's other direction (a protected route bouncing an anonymous session
# back) is asserted in src/navigation/authGuard.test.ts and by the layout's own
# suite. It cannot be exercised from here any more: there is no longer a
# control on welcome that points at a protected route.

- tapOn:
    id: "welcome-register"
- extendedWaitUntil:
    visible:
      id: "register-screen"
    timeout: 20000

# Walk the wizard to its last step. Contact, then identity, then security --
# which is also the only way to reach the code field, and the reason the notice
# below matters: the screen used to ask for "the code sent to your phone" while
# nothing sent one and no button asked for one, which is what blocked the first
# person who tried to create an account.
- tapOn:
    id: "register-phone-input"
- inputText: "+233209998887"
- hideKeyboard
- tapOn:
    id: "register-next"

- tapOn:
    id: "register-full-name-input"
- inputText: "Test Client"
- hideKeyboard
- tapOn:
    id: "register-email-input"
- inputText: "test.client@kaya.local"
- hideKeyboard
- tapOn:
    id: "register-next"

- assertVisible:
    id: "register-dev-notice"

- back
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 20000

- tapOn:
    id: "welcome-login"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
- assertVisible:
    id: "login-dev-notice"
