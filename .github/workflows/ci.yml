name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Flutter job that used to live here ran `flutter analyze` and `flutter
# test` across legacy/flutter/{kaya_core,client,driver} on every pull request.
# It was removed when phase 1C landed, for two reasons. The cost is the smaller
# one: a Flutter toolchain install and three suites on every PR, including PRs
# that only touch packages/ or backend/. The real problem is the signal -- a
# green "flutter" check reads as "the mobile apps are covered", and since the
# React Native migration it means the opposite: it covers the code being
# retired while saying nothing about the code that replaced it.
#
# The Flutter tree stays under legacy/ as the reference the port is read
# against (every @kaya/core and @kaya/ui module cites its Dart original), and
# it can still be run by hand from there. It is no longer a gate.
#
# What gates the apps now: core.yml, ui.yml, client.yml and driver.yml, one per
# workspace, each running lint + typecheck + test.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test
