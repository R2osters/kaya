name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.4
          channel: stable
          cache: true
      - name: Analyze & test kaya_core
        working-directory: legacy/flutter/kaya_core
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze & test client app
        working-directory: legacy/flutter/client
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze & test driver app
        working-directory: legacy/flutter/driver
        run: |
          flutter pub get
          flutter analyze
          flutter test
